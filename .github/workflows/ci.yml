name: Admin Panel CI & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-admin-codebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax & Controllers
        run: |
          echo "Starting Team Apex Admin code verification..."
          find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} +
          echo "All JavaScript files passed syntax verification!"

      - name: Verify Vercel Deployment Artifact
        run: |
          echo "Admin Panel Vercel bundle verified successfully!"
