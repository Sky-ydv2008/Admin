<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events & Workshops — Apex Innovators Admin</title>
  <meta name="description" content="Administer Apex Innovators events, hackathons, and workshops.">
  <meta name="theme-color" content="#0a0f1a">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/human.css">
  <script src="js/fast-nav.js" defer></script>
</head>
<body class="admin-body">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="main-content">
        <div class="admin-stack">
          <div class="toolbar">
            <div class="toolbar-left filter-row">
              <input class="input" id="filter-q" type="search" placeholder="Search events..." style="max-width:260px;">
              <select class="input" id="filter-status" style="width:auto;">
                <option value="">All statuses</option>
                <option value="UPCOMING">Upcoming</option>
                <option value="COMPLETED">Completed</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
            </div>
            <div class="toolbar-right">
              <button class="btn btn-primary" type="button" id="btn-new">
                <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Event
              </button>
            </div>
          </div>

          <p class="results-meta" id="list-info" role="status"></p>

          <div class="table-wrap">
            <div class="table-scroll">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Event Title</th>
                    <th scope="col">Date & Time</th>
                    <th scope="col">Location</th>
                    <th scope="col">Status</th>
                    <th scope="col" class="hide-md">Registration URL</th>
                    <th scope="col">Actions</th>
                  </tr>
                </thead>
                <tbody id="table-body"></tbody>
              </table>
            </div>
          </div>
          <div id="table-pager"></div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="event-modal" class="modal" aria-labelledby="event-modal-title">
    <div class="modal-box wide">
      <div class="modal-head">
        <h2 id="event-modal-title">New Event</h2>
        <button class="modal-close" type="button" data-dialog-close aria-label="Close">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="event-form" class="modal-body form" novalidate>
        <input type="hidden" id="e-id" value="">
        <div class="form-grid">
          <div class="field span-2">
            <label for="e-title">Event Title <span class="req">*</span></label>
            <input class="input" id="e-title" type="text" placeholder="e.g. AI & Mini ERP Tech Talk 2026" required>
          </div>
          <div class="field">
            <label for="e-date">Date & Time</label>
            <input class="input" id="e-date" type="datetime-local">
          </div>
          <div class="field">
            <label for="e-status">Status</label>
            <select class="input" id="e-status">
              <option value="UPCOMING">Upcoming</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
          <div class="field span-2">
            <label for="e-location">Location / Platform</label>
            <input class="input" id="e-location" type="text" placeholder="e.g. Parul University Auditorium / Google Meet">
          </div>
          <div class="field span-2">
            <label for="e-register-url">Registration Link</label>
            <input class="input" id="e-register-url" type="url" placeholder="https://…">
          </div>
          <div class="field span-2">
            <label for="e-description">Description</label>
            <textarea class="input" id="e-description" rows="4" placeholder="Overview of the workshop or event…"></textarea>
          </div>
        </div>
        <div class="modal-foot" style="padding-inline:0;border-top:none;padding-bottom:0;">
          <span class="spacer"></span>
          <button class="btn btn-ghost" type="button" data-dialog-close>Cancel</button>
          <button class="btn btn-primary" type="submit">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            Save Event
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/admin/admin-events.js"></script>
</body>
</html>
